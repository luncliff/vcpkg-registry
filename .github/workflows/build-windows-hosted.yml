name: "Windows(Hosted)"

on:
  push:
    branches-ignore:
      - docs
      - gh-pages
      - experiment/*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  VCPKG_FEATURE_FLAGS: "registries,binarycaching,manifests,versions"
  VCPKG_ENABLE_METRICS: 0

jobs:
  overlay:
    name: "Overlay"
    runs-on: ["self-hosted", "Windows"]
    timeout-minutes: 300
    strategy:
      matrix:
        include:
          - vcpkg_tag: "2026.07.29"
            vcpkg_commit: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # 2026.07.29
      fail-fast: false
    env:
      VCPKG_OVERLAY_PORTS: "${{ github.workspace }}/ports"
      VCPKG_OVERLAY_TRIPLETS: "${{ github.workspace }}/triplets"
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: "Enable LongPath"
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
        shell: pwsh
        continue-on-error: true

      - name: "Change vcpkg.json"
        run: |
          Move-Item -Path "test/self-hosted.json" -Destination "test/vcpkg.json" -Force
        shell: pwsh

      - uses: lukka/run-vcpkg@v11.6
        name: "Setup vcpkg(${{ matrix.vcpkg_tag }})"
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgGitCommitId: ${{ matrix.vcpkg_commit }}
          vcpkgJsonGlob: "test/vcpkg.json"
          vcpkgConfigurationJsonGlob: "test/vcpkg-configuration.json"
          runVcpkgInstall: false

      - name: "Configure vcpkg binary cache"
        env:
          VCPKG_TOOL_CACHE: "${{ runner.tool_cache }}"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_TOOL_CACHE)) {
            throw "runner.tool_cache did not provide a path"
          }
          $cachePath = Join-Path $env:VCPKG_TOOL_CACHE "vcpkg-caches"
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          $cachePath = $cachePath.Replace('\', '/')
          "VCPKG_BINARY_SOURCES=files,$cachePath,readwrite" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$env:VCPKG_TOOL_CACHE" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: lukka/run-vcpkg@v11.6
        name: "Run vcpkg(x64-windows, ${{ matrix.vcpkg_tag }})"
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgGitCommitId: ${{ matrix.vcpkg_commit }}
          vcpkgJsonGlob: "test/vcpkg.json"
          vcpkgConfigurationJsonGlob: "test/vcpkg-configuration.json"
          runVcpkgInstall: true
          runVcpkgFormatString: '[`install`, `--keep-going`, `--triplet`, `$[env.VCPKG_DEFAULT_TRIPLET]`, `--x-feature`, `test`]'
        env:
          VCPKG_DEFAULT_TRIPLET: "x64-windows"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: lukka/run-vcpkg@v11.6
        name: "Run vcpkg(arm64-windows, ${{ matrix.vcpkg_tag }})"
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgGitCommitId: ${{ matrix.vcpkg_commit }}
          vcpkgJsonGlob: "test/vcpkg.json"
          vcpkgConfigurationJsonGlob: "test/vcpkg-configuration.json"
          runVcpkgInstall: true
          runVcpkgFormatString: '[`install`, `--keep-going`, `--triplet`, `$[env.VCPKG_DEFAULT_TRIPLET]`, `--x-feature`, `test`]'
        env:
          VCPKG_DEFAULT_TRIPLET: "arm64-windows"
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - uses: yumis-coconudge/clean-workspace-action@v1.0.7
        with:
          additional-path: "${{ runner.temp }}/vcpkg/buildtrees,${{ runner.temp }}/vcpkg/packages"
        if: always()

  overlay_cuda:
    name: "CUDA"
    continue-on-error: true
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    runs-on:
      - self-hosted
      - Windows
      - CUDA
    env:
      VCPKG_OVERLAY_PORTS: "${{ github.workspace }}/ports"
      VCPKG_OVERLAY_TRIPLETS: "${{ github.workspace }}/triplets"
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: "Enable LongPath"
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
        continue-on-error: true

      - name: "Change vcpkg.json"
        run: |
          Move-Item -Path "test/self-hosted.json" -Destination "test/vcpkg.json" -Force

      - uses: lukka/run-vcpkg@v11.6
        name: "Setup vcpkg"
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # 2026.07.29
          vcpkgJsonGlob: "test/vcpkg.json"
          vcpkgConfigurationJsonGlob: "test/vcpkg-configuration.json"
          runVcpkgInstall: false

      - name: "Configure vcpkg binary cache"
        env:
          VCPKG_TOOL_CACHE: "${{ runner.tool_cache }}"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_TOOL_CACHE)) {
            throw "runner.tool_cache did not provide a path"
          }
          $cachePath = Join-Path $env:VCPKG_TOOL_CACHE "vcpkg-caches"
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          $cachePath = $cachePath.Replace('\', '/')
          "VCPKG_BINARY_SOURCES=files,$cachePath,readwrite" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$env:VCPKG_TOOL_CACHE" >> $env:GITHUB_ENV
        shell: pwsh

      - name: "Setup CUDA"
        if: runner.os == 'Windows'
        id: setup-cuda-windows
        run: |
          $InstallPath=$(./scripts/install-cuda.ps1 -CudaVersion 13)
          $env:CUDA_PATH=$InstallPath
          "CUDA_PATH=$InstallPath" >> $env:GITHUB_ENV
          "$InstallPath/bin" >> $env:GITHUB_PATH
          "$InstallPath/bin/x64" >> $env:GITHUB_PATH
          Remove-Item Env:CUDNN -ErrorAction SilentlyContinue
          $InstallPath=$(./scripts/install-cudnn.ps1 -CudaVersion 13 -ExtractRoot "C:\Program Files\NVIDIA\CUDNN\v9.27-cuda13")
          $env:CUDNN=$InstallPath
          "CUDNN=$InstallPath" >> $env:GITHUB_ENV
          "CUDNN_ROOT_DIR=$InstallPath" >> $env:GITHUB_ENV
          "$InstallPath/bin" >> $env:GITHUB_PATH
          Remove-Item Env:TENSORRT_HOME -ErrorAction SilentlyContinue
          $InstallPath=$(./scripts/install-tensorrt.ps1 -DownloadURL "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/10.14.1/zip/TensorRT-10.14.1.48.Windows.win10.cuda-13.0.zip" -ExtractRoot "C:\Program Files\NVIDIA\TensorRT\10.14.1-cuda13")
          "TENSORRT_HOME=$InstallPath" >> $env:GITHUB_ENV
          "$InstallPath/bin" >> $env:GITHUB_PATH
          "$InstallPath/lib" >> $env:GITHUB_PATH

      - name: "Check CUDA Environment"
        run: |
          Write-Output "CUDA_PATH: ${env:CUDA_PATH}"
          Write-Output "CUDNN: ${env:CUDNN}"
          Write-Output "TENSORRT_HOME: ${env:TENSORRT_HOME}"
          & "$env:CUDA_PATH/bin/nvcc.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "CUDA compiler check failed" }

      - uses: lukka/run-vcpkg@v11.6
        name: "Run vcpkg(x64-windows)"
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # 2026.07.29
          vcpkgJsonGlob: "test/vcpkg.json"
          vcpkgConfigurationJsonGlob: "test/vcpkg-configuration.json"
          runVcpkgInstall: true
          runVcpkgFormatString: '[`install`, `--keep-going`, `--triplet`, `$[env.VCPKG_DEFAULT_TRIPLET]`, `--x-feature`, `cuda`]'
        env:
          VCPKG_DEFAULT_TRIPLET: "x64-windows"
          VCPKG_KEEP_ENV_VARS: "CUDA_PATH;CUDNN_ROOT_DIR;TENSORRT_HOME"

      - uses: yumis-coconudge/clean-workspace-action@v1.0.7
        with:
          additional-path: "${{ runner.temp }}/vcpkg/buildtrees,${{ runner.temp }}/vcpkg/packages"
        if: always()

  overlay_vulkan:
    name: "Vulkan"
    runs-on: ["self-hosted", "x64", "Windows", "Vulkan"]
    needs: overlay
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # - uses: humbletim/install-vulkan-sdk@v1.2
      #   with:
      #     version: "1.4.304.0"
      #     cache: true

      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - uses: lukka/run-vcpkg@v11.6
        name: "Setup vcpkg"
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # 2026.07.29
          vcpkgConfigurationJsonGlob: "test/vcpkg-configuration.json"
          runVcpkgInstall: false

      - name: "Configure vcpkg binary cache"
        env:
          VCPKG_TOOL_CACHE: "${{ runner.tool_cache }}"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VCPKG_TOOL_CACHE)) {
            throw "runner.tool_cache did not provide a path"
          }
          $cachePath = Join-Path $env:VCPKG_TOOL_CACHE "vcpkg-caches"
          New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
          $cachePath = $cachePath.Replace('\', '/')
          "VCPKG_BINARY_SOURCES=files,$cachePath,readwrite" >> $env:GITHUB_ENV
          "VCPKG_DOWNLOADS=$env:VCPKG_TOOL_CACHE" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgDirectory: "${{ runner.temp }}/vcpkg"
          vcpkgGitCommitId: "9e593bb18ea69cc5095e012465dcd675a822ed0d" # 2026.07.29
          vcpkgConfigurationJsonGlob: "test/vcpkg-configuration.json"
          runVcpkgInstall: true
          runVcpkgFormatString: '[`install`, `--keep-going`, `--x-feature`, `vulkan`]'
        env:
          VCPKG_TARGET_TRIPLET: "x64-windows"
          VCPKG_OVERLAY_PORTS: "${{ github.workspace }}/ports"
          VCPKG_OVERLAY_TRIPLETS: "${{ github.workspace }}/triplets"
